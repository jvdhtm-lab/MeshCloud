# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Only fail on unmaintained crates we own; transitive unmaintained crates are
# surfaced as warnings rather than blocking the build.
unmaintained = "workspace"
# Ignored advisories are optional/feature-gated transitive deps that are not
# reachable from any built configuration:
#   RUSTSEC-2025-0111  tokio-tar (dev-only via testcontainers; no fix)
#   RUSTSEC-2026-0118  hickory-proto (libp2p DNS transport; not enabled)
#   RUSTSEC-2026-0119  hickory-proto (same; not enabled)
#   RUSTSEC-2023-0071  rsa (optional transitive; no fix available)
ignore = [
    "RUSTSEC-2025-0111",
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    "RUSTSEC-2023-0071",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    # Duplicate crypto / runtime stacks.
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
