[package]
name = "meshcloud-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Standalone cargo-fuzz project (not part of the workspace).
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.mesh-network]
path = "../crates/mesh-network"

[dependencies.mesh-agent-protocol]
path = "../crates/mesh-agent-protocol"

[[bin]]
name = "advertisement"
path = "fuzz_targets/advertisement.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_message"
path = "fuzz_targets/agent_message.rs"
test = false
doc = false
bench = false
